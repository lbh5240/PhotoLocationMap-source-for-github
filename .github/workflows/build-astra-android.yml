name: Build ASTRA Android
on:
  push:
    branches: ['codex/astra-ipa']
    paths: ['ASTRA/Android/**', 'ASTRA/Core/**', '.github/workflows/build-astra-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ASTRA/Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install native tools and fetch pinned RAW source
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.3.13750724'
          mkdir -p third_party
          git clone --depth 1 --branch 0.22.3 https://github.com/LibRaw/LibRaw.git third_party/LibRaw
          git -C third_party/LibRaw rev-parse HEAD
          mkdir -p app/src/main/assets/LibRaw
          cp third_party/LibRaw/LICENSE.CDDL third_party/LibRaw/COPYRIGHT app/src/main/assets/LibRaw/
          printf 'LibRaw 0.22.3, distributed under CDDL 1.0.\nSource: https://github.com/LibRaw/LibRaw/tree/0.22.3\n' > app/src/main/assets/LibRaw/NOTICE.txt
      - name: Create reproducible CFA fixture
        run: python3 ../Scripts/make_dng_fixture.py
      - name: Build APK and instrumented regression tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-Android-APK
          path: ASTRA/Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise import, real pixel stack, color wheels and RAW decoder
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: ASTRA/Android
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-Android-tests
          path: |
            ASTRA/Android/app/build/outputs/androidTest-results/
            ASTRA/Android/app/build/reports/androidTests/
          if-no-files-found: ignore
