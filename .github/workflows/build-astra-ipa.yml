name: Build ASTRA IPA
on:
  push:
    branches: ['codex/astra-ipa']
    paths:
      - 'ASTRA/**'
      - '!ASTRA/Android/**'
      - '.github/workflows/build-astra-ipa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ASTRA
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect Xcode and build simulator app
        run: |
          set -o pipefail
          xcodebuild -version
          mkdir -p Build
          xcodebuild -project ASTRA.xcodeproj -scheme ASTRA -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath Build/Simulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee Build/simulator-build.log
      - name: Test stacking and editor gestures on iOS 27
        timeout-minutes: 13
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for runtime, items in devices.items() if "iOS-27" in runtime
                     for d in items if d["name"].startswith("iPhone")]
          if not iphones:
              sys.exit("An iOS 27 iPhone simulator is required")
          print(iphones[0]["udid"])
          ')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project ASTRA.xcodeproj -scheme ASTRA -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -destination-timeout 180 \
            -derivedDataPath Build/Simulator -parallel-testing-enabled NO \
            -resultBundlePath Build/StackTests.xcresult \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee Build/stack-ui.log
          container="$(xcrun simctl get_app_container "$device" com.astra.starrynight data)"
          python3 Scripts/verify_stack_fixture.py "$container/Documents/ASTRA"
      - name: Export editor screenshots
        if: always()
        run: |
          if [[ -d Build/StackTests.xcresult ]]; then
            xcrun xcresulttool export attachments --path Build/StackTests.xcresult --output-path Build/EditorQA
          fi
      - name: Upload editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-editor-qa
          path: ASTRA/Build/EditorQA/
          if-no-files-found: ignore
      - name: Verify RAW and JPEG selection rules
        run: |
          swiftc App/Models.swift App/StackSelection.swift Tests/SelectionTests.swift -o Build/selection-tests
          Build/selection-tests
      - name: Test core and archive arm64 device app
        run: bash Scripts/build-unsigned.sh
      - name: Validate IPA
        run: |
          unzip -t Build/ASTRA-unsigned.ipa
          test "$(xcrun lipo -archs Build/ASTRA.xcarchive/Products/Applications/ASTRA.app/ASTRA)" = arm64
          cat Build/ASTRA-unsigned.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-unsigned-IPA
          path: |
            ASTRA/Build/ASTRA-unsigned.ipa
            ASTRA/Build/ASTRA-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-build-logs
          path: ASTRA/Build/*.log
          if-no-files-found: ignore
